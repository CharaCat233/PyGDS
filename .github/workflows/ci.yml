name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Godot headless tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          ls -la Godot*

      - name: Run behavior tests (test.gd)
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://test.gd

      - name: Run suspend system tests
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://demo/test_suspend_all.gd
